name: Build Pyrtugues APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: 📱 Gerar APK do Pyrtugues
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. BAIXAR O PROJETO
      # ==========================================================
      - name: 📥 Baixar código
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON DO GITHUB
      # ==========================================================
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 3. DEPENDÊNCIAS DO LINUX
      # ==========================================================
      - name: 📦 Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================================
      # 4. FORÇAR JAVA 17
      # ==========================================================
      - name: ☕ Configurar Java 17
        run: |
          echo "=== Java disponível ==="

          java -version

          echo ""
          echo "=== Localização do Java ==="

          JAVA17=$(dirname "$(dirname "$(readlink -f "$(which java)")")")

          echo "Java encontrado em:"
          echo "$JAVA17"

          echo ""
          echo "=== Configurando JAVA_HOME ==="

          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA17"

          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "=== Java final ==="

          java -version


      # ==========================================================
      # 5. INSTALAR BUILDOZER + CYTHON
      # ==========================================================
      - name: 🔧 Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.37


      # ==========================================================
      # 6. VERIFICAR AMBIENTE
      # ==========================================================
      - name: 🔍 Verificar ambiente
        run: |
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="

          python --version

          echo ""
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version

          echo ""
          echo "=========================================="
          echo "CYTHON"
          echo "=========================================="

          cython --version

          echo ""
          echo "=========================================="
          echo "ARQUIVOS"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "MAIN.PY"
          echo "=========================================="

          if [ ! -f main.py ]; then
            echo "❌ ERRO: main.py não existe na raiz do projeto."
            exit 1
          fi

          echo "✅ main.py encontrado."

          wc -l main.py
          ls -lh main.py


      # ==========================================================
      # 7. CRIAR BUILDOZER.SPEC
      # ==========================================================
      - name: ⚙️ Criar configuração Android
        run: |

          buildozer init

          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          s = p.read_text()

          # ------------------------------------------------------
          # Aplicativo
          # ------------------------------------------------------

          s = s.replace(
              "title = My Application",
              "title = Pyrtugues"
          )

          s = s.replace(
              "package.name = myapp",
              "package.name = pyrtugues"
          )

          s = s.replace(
              "package.domain = org.test",
              "package.domain = org.pyrtugues"
          )

          # ------------------------------------------------------
          # Python + Kivy
          # ------------------------------------------------------

          s = s.replace(
              "requirements = python3,kivy",
              "requirements = python3==3.11.9,kivy"
          )

          # ------------------------------------------------------
          # Arquivos
          # ------------------------------------------------------

          s = s.replace(
              "#source.include_exts = py,png,jpg,kv,atlas",
              "source.include_exts = py,png,jpg,kv,atlas,ttf,otf"
          )

          # ------------------------------------------------------
          # Tela vertical
          # ------------------------------------------------------

          s = s.replace(
              "#orientation = portrait",
              "orientation = portrait"
          )

          # ------------------------------------------------------
          # Android
          # ------------------------------------------------------

          s = s.replace(
              "#android.api = 33",
              "android.api = 33"
          )

          s = s.replace(
              "#android.minapi = 21",
              "android.minapi = 24"
          )

          # ------------------------------------------------------
          # Arquitetura
          # ------------------------------------------------------

          s = s.replace(
              "#android.archs = arm64-v8a, armeabi-v7a",
              "android.archs = arm64-v8a"
          )

          # ------------------------------------------------------
          # Fixar python-for-android
          # ------------------------------------------------------

          s = s.replace(
              "#p4a.commit = HEAD",
              "p4a.commit = 957a3e5"
          )

          p.write_text(s)
          PY


      # ==========================================================
      # 8. CONFERIR CONFIGURAÇÃO
      # ==========================================================
      - name: 🔎 Conferir buildozer.spec
        run: |

          echo "=========================================="
          echo "BUILDOZER.SPEC"
          echo "=========================================="

          grep -E \
            "^(title|package.name|package.domain|requirements|source.include_exts|orientation|android.api|android.minapi|android.archs|p4a.commit)" \
            buildozer.spec

          echo ""
          echo "=========================================="
          echo "JAVA ANTES DO BUILD"
          echo "=========================================="

          echo "JAVA_HOME=$JAVA_HOME"

          java -version


      # ==========================================================
      # 9. LIMPAR BUILD ANTERIOR
      # ==========================================================
      - name: 🧹 Limpar ambiente de build
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Ambiente limpo."


      # ==========================================================
      # 10. GERAR APK
      # ==========================================================
      - name: 🚀 Gerar APK
        run: |
          set -o pipefail

          echo "=========================================="
          echo "INICIANDO BUILD"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "=========================================="
          echo "BUILD ANDROID"
          echo "=========================================="

          yes | buildozer -v android debug


      # ==========================================================
      # 11. VERIFICAR APK
      # ==========================================================
      - name: 🔍 Procurar APK
        run: |

          echo "=========================================="
          echo "APKs GERADOS"
          echo "=========================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo ""

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ Nenhum APK foi encontrado."
            exit 1
          fi

          echo "✅ APK encontrado!"

          echo ""
          echo "Tamanho:"

          ls -lh bin/*.apk


      # ==========================================================
      # 12. PUBLICAR APK
      # ==========================================================
      - name: 📱 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pyrtugues-APK
          path: bin/*.apk
          if-no-files-found: error

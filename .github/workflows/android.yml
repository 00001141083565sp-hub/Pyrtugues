name: Build Pyrtugues APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Baixar o projeto
      # ============================================================
      - name: 📥 Baixar código
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python usado PELO GITHUB
      # ============================================================
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Dependências do Linux
      # ============================================================
      - name: 📦 Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: ☕ Configurar Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64

          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ============================================================
      # 4. Instalar ferramentas Python
      # ============================================================
      - name: 🔧 Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.37


      # ============================================================
      # 5. Conferir ambiente
      # ============================================================
      - name: 🔍 Verificar ambiente
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"
          python --version

          echo ""
          echo "======================================"
          echo "PIP"
          echo "======================================"
          python -m pip --version

          echo ""
          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"
          buildozer --version

          echo ""
          echo "======================================"
          echo "CYTHON"
          echo "======================================"
          cython --version

          echo ""
          echo "======================================"
          echo "ARQUIVOS DO PROJETO"
          echo "======================================"
          ls -lah


      # ============================================================
      # 6. Criar buildozer.spec
      # ============================================================
      - name: ⚙️ Configurar Buildozer
        run: |

          buildozer init

          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          s = p.read_text()

          # --------------------------------------------------------
          # Informações do aplicativo
          # --------------------------------------------------------

          s = s.replace(
              "title = My Application",
              "title = Pyrtugues"
          )

          s = s.replace(
              "package.name = myapp",
              "package.name = pyrtugues"
          )

          s = s.replace(
              "package.domain = org.test",
              "package.domain = org.pyrtugues"
          )

          # --------------------------------------------------------
          # Python + Kivy
          # --------------------------------------------------------

          s = s.replace(
              "requirements = python3,kivy",
              "requirements = python3==3.11.9,kivy"
          )

          # --------------------------------------------------------
          # Arquivos incluídos
          # --------------------------------------------------------

          s = s.replace(
              "#source.include_exts = py,png,jpg,kv,atlas",
              "source.include_exts = py,png,jpg,kv,atlas,ttf,otf"
          )

          # --------------------------------------------------------
          # Orientação
          # --------------------------------------------------------

          s = s.replace(
              "#orientation = portrait",
              "orientation = portrait"
          )

          # --------------------------------------------------------
          # Android
          # --------------------------------------------------------

          s = s.replace(
              "#android.api = 33",
              "android.api = 33"
          )

          s = s.replace(
              "#android.minapi = 21",
              "android.minapi = 24"
          )

          s = s.replace(
              "#android.archs = arm64-v8a, armeabi-v7a",
              "android.archs = arm64-v8a"
          )

          # --------------------------------------------------------
          # Fixar python-for-android
          # --------------------------------------------------------

          s = s.replace(
              "#p4a.commit = HEAD",
              "p4a.commit = 957a3e5"
          )

          p.write_text(s)
          PY


      # ============================================================
      # 7. Conferir buildozer.spec ANTES DO BUILD
      # ============================================================
      - name: 🔎 Conferir configuração
        run: |

          echo "======================================"
          echo "BUILDOZER.SPEC"
          echo "======================================"

          grep -E \
            "^(title|package.name|package.domain|requirements|source.include_exts|orientation|android.api|android.minapi|android.archs|p4a.commit)" \
            buildozer.spec

          echo ""
          echo "======================================"
          echo "MAIN.PY"
          echo "======================================"

          if [ -f main.py ]; then
            echo "main.py encontrado ✅"
            wc -l main.py
            ls -lh main.py
          else
            echo "ERRO: main.py não encontrado ❌"
            exit 1
          fi


      # ============================================================
      # 8. Limpar restos de builds anteriores
      # ============================================================
      - name: 🧹 Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ============================================================
      # 9. GERAR APK
      # ============================================================
      - name: 🚀 Gerar APK
        run: |
          set -o pipefail

          yes | buildozer -v android debug


      # ============================================================
      # 10. Procurar APK
      # ============================================================
      - name: 🔍 Procurar APK
        run: |

          echo "======================================"
          echo "APKs GERADOS"
          echo "======================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo ""

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum APK foi gerado ❌"
            exit 1
          fi

          echo "APK encontrado ✅"


      # ============================================================
      # 11. Publicar APK para download
      # ============================================================
      - name: 📱 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pyrtugues-APK
          path: bin/*.apk
          if-no-files-found: error
